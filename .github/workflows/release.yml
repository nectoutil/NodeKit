name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  pnpm_config_verify_deps_before_run: 'false'

jobs:
  release:
    name: Release
    # Changesets uses github.sha when preparing the version PR branch.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NECTO_BOT_ID }}
          private-key: ${{ secrets.NECTO_BOT_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install PNPM & Dependencies
        uses: pnpm/action-setup@v6
        with:
          run_install: |
            - args: [--frozen-lockfile, --ignore-scripts]

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.event.workflow_run.head_sha }}
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean package.json files for publish
        run: pnpm clean-publish

      - name: Create Release PR
        id: create_release_pr
        uses: changesets/action@v1
        with:
          createGithubReleases: true
          commit: 'Package Versioning'
          title: 'Automated Package Release'
          publish: pnpm exec changeset publish
        env:
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Enable auto-merge on release PR
        if: steps.create_release_pr.outputs.pullRequestNumber
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.generate_token.outputs.token }}
          pull-request-number: ${{ steps.create_release_pr.outputs.pullRequestNumber }}
          merge-method: squash
